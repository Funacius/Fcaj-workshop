baseURL = "/"
relativeURLs = false
canonifyURLs = false
defaultContentLanguage = "en"
theme = "hugo-theme-learn"
title = "EduCloud Lite Internship Report"
enableRobotsTXT = true

[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
  themeVariant = "workshop"
  editURL = ""
  description = "Internship report and hands-on AWS workshop for the EduCloud Lite learning management platform."
  author = "EduCloud project team"
  showVisitedLinks = true
  disableBreadcrumb = false
  disableNextPrev = false
  disableSearch = false
  disableAssetsBusting = false

[languages]
  [languages.en]
    title = "EduCloud Lite Internship Report"
    languageName = "English"
    weight = 1

    [[languages.en.menu.shortcuts]]
      name = "<i class='fas fa-external-link-alt'></i> Live EduCloud"
      identifier = "educloud-live"
      url = "https://main.djk00b5qbck73.amplifyapp.com/courses"
      weight = 1

    [[languages.en.menu.shortcuts]]
      name = "<i class='fab fa-github'></i> EduCloud source code"
      identifier = "educloud-source"
      url = "https://github.com/Funacius/EduCloud"
      weight = 2

    [[languages.en.menu.shortcuts]]
      name = "<i class='fas fa-tools'></i> Build and setup guide"
      identifier = "educloud-build-guide"
      url = "https://github.com/Funacius/EduCloud#run-locally-with-supabase"
      weight = 3

    [[languages.en.menu.shortcuts]]
      name = "<i class='fab fa-aws'></i> AWS Study Group - Blog"
      identifier = "aws-study-group-blog"
      url = "https://awsstudygroup.com"
      weight = 10

    [[languages.en.menu.shortcuts]]
      name = "<i class='fab fa-facebook'></i> AWS Study Group - FB Group"
      identifier = "aws-study-group-fb"
      url = "https://www.facebook.com/groups/660548818043427"
      weight = 20

  [languages.vi]
    title = "Báo cáo thực tập EduCloud Lite"
    languageName = "Tiếng Việt"
    weight = 2

    [[languages.vi.menu.shortcuts]]
      name = "<i class='fas fa-external-link-alt'></i> Website EduCloud"
      identifier = "educloud-live-vi"
      url = "https://main.djk00b5qbck73.amplifyapp.com/courses"
      weight = 1

    [[languages.vi.menu.shortcuts]]
      name = "<i class='fab fa-github'></i> Mã nguồn EduCloud"
      identifier = "educloud-source-vi"
      url = "https://github.com/Funacius/EduCloud"
      weight = 2

    [[languages.vi.menu.shortcuts]]
      name = "<i class='fas fa-tools'></i> Hướng dẫn build và cài đặt"
      identifier = "educloud-build-guide-vi"
      url = "https://github.com/Funacius/EduCloud#run-locally-with-supabase"
      weight = 3

    [[languages.vi.menu.shortcuts]]
      name = "<i class='fab fa-aws'></i> AWS Study Group - Blog"
      identifier = "aws-study-group-blog-vi"
      url = "https://awsstudygroup.com"
      weight = 10

    [[languages.vi.menu.shortcuts]]
      name = "<i class='fab fa-facebook'></i> AWS Study Group - FB Group"
      identifier = "aws-study-group-fb-vi"
      url = "https://www.facebook.com/groups/660548818043427"
      weight = 20

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[caches]
  [caches.images]
    dir = ":cacheDir/images"
